<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account | MUST Applications</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">MUST</div>
        <p>Mbarara University of Science and Technology</p>
      </header>

      <h1 id="page-title">Create an account</h1>
      <p class="intro">Enter your details to get started.</p>

      <form action="#" method="post">
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" name="full-name" placeholder="Your full name" autocomplete="name" required>

        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

        <label for="password">Create a password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>

        <button type="submit">Create account</button>
      </form>

      <p class="switch-page">Already have an account? <a href="index.html">Log in</a></p>
    </section>
    <footer>© MUST Applications</footer>
  </main>
</body>
</html>
