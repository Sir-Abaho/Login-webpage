<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Set the page character set, responsive layout, title, and shared stylesheet. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | MUST Applications</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main page content, including the login card and footer. -->
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <!-- University name and short text-based logo. -->
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">MUST</div>
        <p>Mbarara University of Science and Technology</p>
      </header>

      <!-- Page heading and a short instruction for the user. -->
      <h1 id="page-title">Welcome back</h1>
      <p class="intro">Log in to continue to your application.</p>

      <!-- Login form; required fields use built-in browser validation. -->
      <form action="#" method="post">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
      </form>

      <!-- Link to the account creation page. -->
      <p class="switch-page">Don't have an account? <a href="create-account.html">Create an account</a></p>
    </section>

    <!-- Small footer at the bottom of the page. -->
    <footer>© MUST Applications</footer>
  </main>
</body>
</html>
