<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | MUST Applications</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">MUST</div>
        <p>Mbarara University of Science and Technology</p>
      </header>

      <h1 id="page-title">Welcome back</h1>
      <p class="intro">Log in to continue to your application.</p>

      <form action="#" method="post">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
      </form>

      <p class="switch-page">Don't have an account? <a href="create-account.html">Create an account</a></p>
    </section>
    <footer>© MUST Applications</footer>
  </main>
</body>
</html>
